[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deki-smpc"
version = "1.0.0"
description = "Round-scoped secure aggregation client"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Benjamin Hamm", email = "benjamin.hamm@dkfz-heidelberg.de"}]
dependencies = [
  "cryptography>=50,<51",
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
  "safetensors>=0.4,<1",
  "torch>=2.13,<3",
]

[project.optional-dependencies]
mnist = [
  "torchvision>=0.19,<1",
]
test = [
  "mypy>=1.15,<2",
  "pre-commit>=4,<5",
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
include = ["deki_smpc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.isort]
profile = "black"
line_length = 120
py_version = 312
known_first_party = ["deki_smpc"]

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["deki_smpc"]
